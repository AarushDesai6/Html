<html>
    <head>
        <title>My Animal Facts</title>
        <style>/*Page Background - sets the colour and font for the whole page */
        body {
            background-color:bisque;
            font-family: Arial, sans-serif;
        }
        /* Box Model - width sets the content area padding pushes the text away from the edges border draws a visible frame around the fact fil margin pushes the fact file away from the screen edge*/
        .fact-file {
        background-color: lightblue;
        color: black;
        width: 260px;
        padding: 25px;
        border: 5px solid forestgreen;
        margin: 30 px;
    }
    /* Animal name- forestgreen so it stands out */
    .animal-name {
        color: forestgreen;
        font-size: 22px;
    }
    /* Detail rows - dark text on the light background*/
    .detail {
        color: darkslategray;
    }
    /* Cool fact - orange and italic to make it feels special*/
    .cool-fact {
        color: darkorange;
        font-style: italic;
    }
    </style>
    </head>
    <body>
        <div class="fact-file">
            <h1 class="animal-name">Snow Leopard</h1>
            <p class="detail">Type: Big Cat</p>
            <p class="detail">Habitat: Mountainous regions of Central Asia</p>
            <p class="detail">Diet: Deer, goats, and wild sheep</p>
            <p class="cool-fact">Cool Fact: Snow leopards can leap up to 15 metres in a single jump!</p>
        </div>
        
    </body>
</html>
