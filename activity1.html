<!DOCTYPE html>

<html lang="en">

<head>

    <title>Cards</title>


    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</head>

<body>
    <h1>Personnel Details Form</h1>
    <form>
        <label>
            Name
        </label>
        <br>
        <input type="text" id="name"><br><br>
        
        <label>Email ID</label><br>
        <input type="email" id="email"><br><br>
        <label>Contact Number (this will be hidden)</label><br>
        <input type="password" id="contact"><br><br>
        <label>Gender</label><br>
        <input type="radio" id="female" name="gender" value="Female">Female<br>
        <input type="radio" id="male" name="gender" value="Male">Male<br>
        <label>Favorite City</label><input type="checkbox" id="city" value="Mumbai">Mumbai<br>
        <input type="checkbox" id="city" value="Delhi">Delhi<br><br>
        <input type="submit">

    </form>
    </body>
</html>
