<!DOCTYPE html>

<html lang="en">

<head>

    <title></title>


    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</head>

<body>
    <form>
        <fieldset>
            <!-- The fieldset tag is used to group related elements in a form and draws a box around them-->
            <legend>Personal Details</legend>
        <label>Full name</label>
        <!--PlaceHolder attribute can be used to provide extra information about entry to be made-->
        <input type="text" id="fname" placeholder="Enter your name"><br><br>
        <label>Email ID</label><br>
        <input type="text" id="email"><br><br>
        <label>Gender:</label>
        <input type="radio" id="gender" value="Female">Female<br>
        <input type="radio" id="gender" value="Male">Male<br>
        <label>Birthday:</label>
        <input type="date" id="birthday" name="birthday"><br><br>
        </fieldset>
    </form>
    </body>
</html>
